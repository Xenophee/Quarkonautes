# Configuration du datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/quarkonautes
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# --- Hibernate ORM ---
# Hibernate ne modifie pas le schéma (c'est Flyway qui gère)
quarkus.hibernate-orm.database.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true


# Configuration de flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migrations
